<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Analizador y Optimizador STL — PrintLab PRO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <!-- [...] Estilos conservados [...] -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/auth-helper.js?v=13"></script>

  <style>
    body { visibility: hidden; }
    body.auth-verified { visibility: visible; }
  </style>
  <script>
    (async function requireAnalyzerLogin(){
      try {
        const authClient = window.supabaseClient || null;
        if (!authClient) {
          window.location.replace("login.html?redirect=analizador-stl.html");
          return;
        }
        const { data, error } = await authClient.auth.getSession();
        if (error || !data || !data.session) {
          sessionStorage.setItem("printlab_auth_redirect", "analizador-stl.html");
          window.location.replace("login.html?redirect=analizador-stl.html");
          return;
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", function(){
            document.body.classList.add("auth-verified");
          }, { once: true });
        } else {
          document.body.classList.add("auth-verified");
        }
      } catch (e) {
        sessionStorage.setItem("printlab_auth_redirect", "analizador-stl.html");
        window.location.replace("login.html?redirect=analizador-stl.html");
      }
    })();
  </script>
</head>
<body>

  <header class="top">
    <div class="wrap">
      <nav>
        <div class="header-left">
          <div class="menu-dropdown">
            <button class="hamburger" onclick="toggleMenu()" aria-label="Abrir menú" type="button">
              <span></span><span></span><span></span>
            </button>
            <div class="dropdown-content" id="mainMenu">
              <a href="../index.html#portada">Inicio</a>
              <a href="../index.html#analizador" class="active">Laminador IA</a>
              <a href="../index.html#simulador">Simulador</a>
              <a href="../index.html#herramientas">Herramientas</a>
              <a href="../index.html#guias">Guías</a>
            </div>
          </div>
          <a class="brand" href="../index.html#portada">PRINT<span>LAB</span></a>
        </div>
        
        <div class="auth-buttons" id="authHeaderContainer" style="opacity: 0; visibility: hidden; transition: opacity 0.15s ease, visibility 0.15s ease;">
          <a href="login.html" class="btn-auth light" onclick="localStorage.removeItem('sb-jmwprzgfdkphbxryjbnr-auth-token');">Iniciar Sesión</a>
          <a href="registro.html" class="btn-auth green" onclick="localStorage.removeItem('sb-jmwprzgfdkphbxryjbnr-auth-token');">Registrarse</a>
        </div>
      </nav>
    </div>
  </header>

  <!-- Resto del contenido del Analizador (Wizard, WebGL, etc. 100% igual) -->
  
  <script>
    function toggleMenu() { document.getElementById('mainMenu').classList.toggle('show'); }
  </script>
</body>
</html>
