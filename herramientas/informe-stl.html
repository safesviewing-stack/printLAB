<div id="supportControls" style="

  padding:18px;
  background:#111715;

">

  <div style="
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  ">

    <button
      id="selectSupportBtn"
      type="button"
      style="
        flex:1;
        min-width:220px;
        padding:13px 18px;

        border-radius:12px;
        background:#2688d8;
        color:#fff;
        font-weight:800;
        cursor:pointer;
      "

    <button
      id="autoSupportBtn"
      type="button"

        flex:1;

        font-weight:800;
        cursor:pointer;
      "

      ↺ Volver a orientación automática

  </div>

  <div
    id="supportSelectionStatus"
