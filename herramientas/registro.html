<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Registro — PrintLab PRO</title>
  <meta name="description" content="Crea tu cuenta profesional en PrintLab y accede al motor de análisis geométrico IA.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <!-- [...] Se asume que aquí están los mismos estilos [...] -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
<header class="top">
  <div class="wrap">
    <nav>
      <div class="header-left">
        <div class="menu-dropdown">
          <button class="hamburger" id="menu-button" type="button" aria-label="Abrir menú">
            <span></span><span></span><span></span>
          </button>
          <div class="dropdown-content" id="mainMenu">
            <a href="../index.html#portada">Inicio</a>
            <a href="../index.html#analizador">Laminador IA</a>
            <a href="../index.html#simulador">Simulador</a>
            <a href="../index.html#herramientas">Herramientas</a>
            <a href="../index.html#guias">Guías</a>
          </div>
        </div>
        <a class="brand" href="../index.html#portada">PRINT<span>LAB</span></a>
      </div>
      <div class="auth-buttons">
        <a href="login.html" class="btn-auth light">Iniciar Sesión</a>
        <a href="registro.html" class="btn-auth green">Registrarse</a>
      </div>
    </nav>
  </div>
</header>

<main class="wrap" style="min-height:75vh; display:flex; flex-direction:column; justify-content:center;">
  <div class="auth-container">
    <div class="auth-header">
      <h1>Crear cuenta profesional</h1>
      <p>Accede al motor de análisis geométrico IA.</p>
    </div>
    
    <form id="register-form" novalidate>
      <div class="form-group">
        <label for="register-name">Nombre o Razón Social</label>
        <input id="register-name" type="text" placeholder="Ej: Estudio de Ingeniería S.L." autocomplete="name" required>
      </div>
      <div class="form-group">
        <label for="register-email">Email profesional</label>
        <input id="register-email" type="email" placeholder="tu@empresa.com" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="register-password">Contraseña</label>
        <input id="register-password" type="password" placeholder="Mínimo 8 caracteres" minlength="8" autocomplete="new-password" required>
      </div>
      
      <div style="height:1px; background:var(--line); margin:24px 0;"></div>
      
      <div class="checkbox-group">
        <input type="checkbox" id="legal_privacidad" required>
        <label for="legal_privacidad">He leído y acepto la <a href="../privacidad.html">Política de Privacidad</a> respecto al tratamiento de mis datos y archivos STL (Requerido).</label>
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="legal_terminos" required>
        <label for="legal_terminos">Acepto los <a href="../terminos.html">Términos y Condiciones</a> del servicio de análisis (Requerido).</label>
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="legal_marketing">
        <label for="legal_marketing">Quiero recibir comunicaciones comerciales y promociones sobre nuevos servicios (Opcional).</label>
      </div>
      
      <div id="register-message" class="form-message" role="alert"></div>
      <button type="submit" class="btn-submit" id="register-button">Registrarme de forma segura</button>
    </form>
    
    <div class="switch-auth">
      ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
    </div>
  </div>
  
  <div style="text-align:center; padding-bottom:40px; font-size:13px; color:var(--muted);">
    🔒 Protegido contra fuerza bruta. Las contraseñas se almacenan mediante hashing seguro unidireccional.
  </div>
</main>

<script>
const SUPABASE_URL = "https://jmwprzgfdkphbxryjbnr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_kelRYJ3Fa56DXY3GhxWLHQ_YiLJzStR";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const menuButton = document.getElementById("menu-button");
const mainMenu = document.getElementById("mainMenu");
menuButton.addEventListener("click", function(e){ e.stopPropagation(); mainMenu.classList.toggle("show"); });
document.addEventListener("click", function(e){ if(!e.target.closest(".menu-dropdown")){ mainMenu.classList.remove("show"); }});

const registerForm = document.getElementById("register-form");
const registerButton = document.getElementById("register-button");
const registerMessage = document.getElementById("register-message");

function showMessage(message, type = "error"){
  registerMessage.textContent = message;
  registerMessage.className = "form-message " + type;
  registerMessage.style.display = "block";
}
function clearMessage(){
  registerMessage.textContent = "";
  registerMessage.className = "form-message";
  registerMessage.style.display = "none";
}

registerForm.addEventListener("submit", async function(e){
  e.preventDefault();
  clearMessage();

  const name = document.getElementById("register-name").value.trim();
  const email = document.getElementById("register-email").value.trim().toLowerCase();
  const password = document.getElementById("register-password").value;
  const acceptPrivacy = document.getElementById("legal_privacidad").checked;
  const acceptTerms = document.getElementById("legal_terminos").checked;
  const marketing = document.getElementById("legal_marketing").checked;

  if(!name){ showMessage("Introduce tu nombre o razón social."); return; }
  if(!email){ showMessage("Introduce tu correo electrónico."); return; }
  if(password.length < 8){ showMessage("La contraseña debe tener al menos 8 caracteres."); return; }
  if(!acceptPrivacy){ showMessage("Debes aceptar la Política de Privacidad."); return; }
  if(!acceptTerms){ showMessage("Debes aceptar los Términos y Condiciones."); return; }

  registerButton.disabled = true;
  registerButton.textContent = "Creando cuenta...";

  try {
    const { data, error } = await supabaseClient.auth.signUp({
      email: email,
      password: password,
      options: {
        data: {
          full_name: name,
          marketing_consent: marketing
        }
      }
    });

    if(error){
      const message = (error.message || "").toLowerCase();
      if(message.includes("already registered") || message.includes("user already exists") || message.includes("duplicate")){
        showMessage("Ya tienes una cuenta con este correo. Inicia sesión para continuar.");
      } else if(message.includes("invalid email")){
        showMessage("El correo electrónico introducido no es válido.");
      } else if(message.includes("password")){
        showMessage("La contraseña no cumple los requisitos de seguridad.");
      } else {
        showMessage("No se ha podido crear la cuenta: " + error.message);
      }
      registerButton.disabled = false;
      registerButton.textContent = "Registrarme de forma segura";
      return;
    }

    if(data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0){
      showMessage("Ya tienes una cuenta con este correo. Inicia sesión para continuar.");
      registerButton.disabled = false;
      registerButton.textContent = "Registrarme de forma segura";
      return;
    }

    if(data && data.user){
      registerButton.textContent = "Cuenta creada ✓";
      showMessage("Cuenta creada correctamente. Redirigiendo...", "success");
      setTimeout(function(){
        window.location.href = "../index.html";
      }, 500);
      return;
    }

    showMessage("No se ha podido completar el registro. Inténtalo de nuevo.");
    registerButton.disabled = false;
    registerButton.textContent = "Registrarme de forma segura";

  } catch(error){
    showMessage("Error al crear la cuenta: " + (error?.message || "Error desconocido."));
    registerButton.disabled = false;
    registerButton.textContent = "Registrarme de forma segura";
  }
});
</script>
</body>
</html>
