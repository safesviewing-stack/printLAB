<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Registro — PrintLab PRO</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root{ --bg:#f6f7f4; --card:#fff; --ink:#0d1110; --muted:#5e6661; --line:#dfe4df; --accent:#b8ff3d; --dark:#111715; }
    *{box-sizing:border-box} body{margin:0; background:var(--bg); color:var(--ink); font-family:"Plus Jakarta Sans", sans-serif; line-height:1.6; display:flex; flex-direction:column; min-height:100vh;}
    a{color:inherit;text-decoration:none}
    
    .auth-container{max-width:480px; margin:60px auto; background:var(--card); padding:40px; border-radius:24px; border:1px solid var(--line); box-shadow:0 20px 40px rgba(0,0,0,0.03);}
    .auth-header{text-align:center; margin-bottom:32px;}
    .auth-header h1{font-size:28px; font-weight:800; margin:0 0 8px; letter-spacing:-0.5px;}
    .auth-header p{color:var(--muted); font-size:15px; margin:0;}

    .form-group{margin-bottom:20px;}
    .form-group label{display:block; font-size:13px; font-weight:800; margin-bottom:8px; color:var(--ink);}
    .form-group input[type="text"], .form-group input[type="email"], .form-group input[type="password"]{width:100%; padding:14px; border:1.5px solid var(--line); border-radius:12px; font-size:15px; outline:none; transition:.2s;}
    .form-group input:focus{border-color:var(--accent);}

    .checkbox-group{display:flex; align-items:flex-start; gap:12px; margin-bottom:16px; font-size:13.5px; color:var(--muted);}
    .checkbox-group input[type="checkbox"]{margin-top:4px; width:16px; height:16px; accent-color:var(--ink); cursor:pointer;}
    .checkbox-group label a{color:var(--ink); font-weight:800; text-decoration:underline;}

    .btn-submit{width:100%; background:var(--ink); color:#fff; padding:16px; border:none; border-radius:12px; font-weight:800; font-size:16px; cursor:pointer; transition:.2s; margin-top:10px;}
    .btn-submit:hover{background:var(--dark); box-shadow:0 4px 0 var(--accent); transform:translateY(-2px);}

    .switch-auth{text-align:center; margin-top:24px; font-size:14px; color:var(--muted);}
    .switch-auth a{color:var(--ink); font-weight:800; text-decoration:underline;}
  </style>
</head>
<body>

  <div style="padding:24px; text-align:center;">
    <a href="../index.html" style="font-size:24px; font-weight:800; letter-spacing:-1px;">PRINT<span style="background:var(--accent); padding:2px 8px; border-radius:6px;">LAB</span></a>
  </div>

  <main style="flex:1;">
    <div class="auth-container">
      <div class="auth-header">
        <h1>Crear cuenta profesional</h1>
        <p>Accede al motor de análisis geométrico IA.</p>
      </div>

      <form action="#" method="POST">
        <div class="form-group">
          <label>Nombre o Razón Social</label>
          <input type="text" placeholder="Ej: Estudio de Ingeniería S.L." required>
        </div>
        <div class="form-group">
          <label>Email profesional</label>
          <input type="email" placeholder="tu@empresa.com" required>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" placeholder="Mínimo 8 caracteres" required>
        </div>

        <div style="height:1px; background:var(--line); margin:24px 0;"></div>

        <!-- REQUISITOS LEGALES EXACTOS DEL PDF -->
        <div class="checkbox-group">
          <input type="checkbox" id="legal_privacidad" required>
          <label for="legal_privacidad">He leído y acepto la <a href="privacidad.html">Política de Privacidad</a> respecto al tratamiento de mis datos y archivos STL (Requerido).</label>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="legal_terminos" required>
          <label for="legal_terminos">Acepto los <a href="terminos.html">Términos y Condiciones</a> del servicio de análisis (Requerido).</label>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="legal_marketing">
          <label for="legal_marketing">Quiero recibir comunicaciones comerciales y promociones sobre nuevos servicios (Opcional).</label>
        </div>

        <button type="submit" class="btn-submit">Registrarme de forma segura</button>
      </form>

      <div class="switch-auth">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
      </div>
    </div>
  </main>

  <div style="text-align:center; padding:20px; font-size:12px; color:var(--muted);">
    Protegido contra fuerza bruta. Las contraseñas se almacenan mediante hashing seguro unidireccional.
  </div>

</body>
</html>
