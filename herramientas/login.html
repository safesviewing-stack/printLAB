<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Iniciar Sesión — PrintLab PRO</title>
  <meta name="description" content="Accede a tu cuenta en PrintLab para utilizar el analizador STL inteligente y revisar tu historial de optimizaciones.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <!-- [...] Estilos CSS conservados [...] -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/auth-helper.js?v=13"></script>
  <script>
    const SUPABASE_URL = "https://jmwprzgfdkphbxryjbnr.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_kelRYJ3Fa56DXY3GhxWLHQ_YiLJzStR";
    const supabaseClient = window.supabaseClient || supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>
</head>

<body>
  <header class="top">
    <div class="wrap">
      <nav>
        <div class="header-left">
          <div class="menu-dropdown">
            <button class="hamburger" id="menu-button" aria-label="Abrir menú" type="button">
              <span></span><span></span><span></span>
            </button>
            <div class="dropdown-content" id="mainMenu">
              <a href="../index.html#portada">Inicio</a>
              <a href="../index.html#analizador">Laminador IA</a>
              <a href="../index.html#simulador">Simulador</a>
              <a href="../index.html#herramientas">Herramientas</a>
              <a href="../index.html#guias">Guías</a>
            </div>
          </div>
          <a class="brand" href="../index.html#portada" title="Volver al inicio">PRINT<span>LAB</span></a>
        </div>
        <div class="auth-buttons" id="authHeaderContainer" style="opacity: 0; visibility: hidden; transition: opacity 0.15s ease, visibility 0.15s ease;">
          <a href="login.html" class="btn-auth light">Iniciar Sesión</a>
          <a href="registro.html" id="header-register-link" class="btn-auth green">Registrarse</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="wrap" style="min-height:75vh; display:flex; flex-direction:column; justify-content:center;">
    <div class="auth-container">
      <div class="auth-header">
        <h1>Bienvenido de nuevo</h1>
        <p>Inicia sesión para acceder a tu historial de análisis.</p>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-email">Email profesional</label>
          <input id="login-email" type="email" placeholder="tu@empresa.com" autocomplete="email" required>
        </div>
        
        <div class="form-group">
          <!-- Ya no existe el enlace ¿La has olvidado? -->
          <label for="login-password">Contraseña</label>
          <input id="login-password" type="password" placeholder="Tu contraseña segura" autocomplete="current-password" required>
        </div>

        <div id="login-message" class="login-message" aria-live="polite"></div>
        <button type="submit" class="btn-submit" id="login-button">Entrar a mi cuenta</button>
      </form>

      <div class="switch-auth">
        ¿Aún no tienes cuenta? <a id="register-link" href="registro.html">Regístrate gratis</a>
      </div>
    </div>
  </main>

  <script>
    const menuButton = document.getElementById("menu-button");
    const mainMenu = document.getElementById("mainMenu");

    if(menuButton && mainMenu){
      menuButton.addEventListener("click", function(e){
        e.stopPropagation();
        mainMenu.classList.toggle("show");
      });
    }

    document.addEventListener("click", function(e){
      if(!e.target.closest(".menu-dropdown") && mainMenu){
        mainMenu.classList.remove("show");
      }
    });

    const loginForm = document.getElementById("login-form");
    const loginButton = document.getElementById("login-button");
    const loginMessage = document.getElementById("login-message");

    if(loginForm){
      loginForm.addEventListener("submit", async function(e){
        e.preventDefault();

        loginMessage.classList.remove("show");
        loginMessage.textContent = "";

        const email = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-password").value;

        if(!email || !password){
          loginMessage.textContent = "Introduce tu email y contraseña.";
          loginMessage.classList.add("show");
          return;
        }

        loginButton.disabled = true;
        loginButton.textContent = "Iniciando sesión...";

        try{
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

          if(error) throw error;
          if(!data || !data.session) throw new Error("No se pudo crear la sesión.");

          loginButton.textContent = "Sesión iniciada ✓";

          setTimeout(function(){
            // Redirigir siempre directamente al index tras loguearse (según indicaciones)
            window.location.href = "../index.html";
          }, 500);

        } catch(error){
          console.error("Error al iniciar sesión:", error);
          let errorText = "No se pudo iniciar sesión. Comprueba tu email y contraseña.";

          if(error && typeof error.message === "string"){
            const message = error.message.toLowerCase();
            if(message.includes("email not confirmed")){
              errorText = "Debes verificar tu correo electrónico antes de iniciar sesión.";
            } else if(message.includes("invalid login credentials")){
              errorText = "El email o la contraseña no son correctos.";
            } else if(message.includes("too many requests")){
              errorText = "Demasiados intentos. Espera unos minutos y vuelve a intentarlo.";
            }
          }

          loginMessage.textContent = errorText;
          loginMessage.classList.add("show");
          loginButton.disabled = false;
          loginButton.textContent = "Entrar a mi cuenta";
        }
      });
    }
  </script>
</body>
</html>
