<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Calculadora de Coste de Impresión 3D — PrintLab</title>
  <meta name="description" content="Calcula el coste real de tus impresiones 3D: material, consumo eléctrico, amortización de hardware, fallos y margen comercial.">
  <meta name="robots" content="index,follow">
  <!-- Importación de la tipografía Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    /* VARIABLES DE DISEÑO (Estilo UDIA) */
    :root{
      --bg:#f6f7f4;
      --card:#fff;
      --ink:#0d1110;
      --muted:#5e6661;
      --line:#dfe4df;
      --accent:#b8ff3d;
      --dark:#111715;
      --max:1200px;
    }
    *{box-sizing:border-box}html{scroll-behavior:smooth}
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:"Plus Jakarta Sans", "Inter", system-ui, -apple-system, sans-serif;
      line-height:1.6;
      -webkit-font-smoothing:antialiased;
    }
    a{color:inherit;text-decoration:none}
    
    /* Márgenes laterales unificados a 40px */
    .wrap{max-width:var(--max);margin:auto;padding:0 40px}
    
    /* CABECERA FLUIDA */
    .top{position:sticky;top:0;z-index:100;background:rgba(246,247,244,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
    nav{min-height:95px;display:flex;align-items:center;justify-content:space-between;gap:36px}
    .brand{font-size:26px;font-weight:800;letter-spacing:-1px}
    .brand span{background:var(--accent);padding:5px 12px;border-radius:10px;margin-left:6px;color:var(--ink)}
    
    .nav{display:flex;gap:12px;font-size:15px;font-weight:700}
    .nav a{padding:8px 18px;border-radius:9999px;transition:.15s;color:var(--muted)}
    .nav a:hover{color:var(--ink);background:rgba(0,0,0,0.03)}
    .nav a.active{color:var(--ink);background:var(--card);border:1px solid var(--line)}
    
    .tool-header{padding:80px 0 40px; border-bottom:1px solid var(--line); margin-bottom: 50px;}
    .tool-header h1{font-size:clamp(42px, 6vw, 68px); letter-spacing:-2.5px; line-height:1; margin:0 0 16px; font-weight:800}
    .tool-header p{font-size:20px; color:var(--muted); max-width:900px; margin:0; line-height:1.5}
    
    /* Cuadrícula simétrica 50/50 y centrada con los márgenes de página */
    .calc-layout{
      display:grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 40px; 
      align-items: start;
      width: 100%;
      max-width: 100%;
    }
    
    /* Paneles de entrada con padding simétrico en las 4 direcciones */
    .input-panel{background:var(--card); border:1.5px solid var(--line); border-radius:26px; padding:40px; margin-bottom: 30px;}
    .input-panel h2{font-size:26px; letter-spacing:-1px; margin:0 0 24px; border-bottom: 1.5px solid var(--line); padding-bottom:12px; font-weight:800}
    
    .input-grid{display:grid; grid-template-columns: 1fr 1fr; gap:24px}
    .input-group{display:flex; flex-direction:column;}
    .input-group
